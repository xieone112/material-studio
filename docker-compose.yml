services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: material_studio
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: material_studio
      DB_USER: root
      DB_PASSWORD: root
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - upload-data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql-data:
  upload-data:
